services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jcyber}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-jcyber}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jcyber} -d ${POSTGRES_DB:-jcyber}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  browser:
    image: ghcr.io/browserless/chromium:v2.58.3@sha256:2d891ba17f069e7da7867bc7f86d40c36267f0108f7178c5700a8fdf6ba4eca6
    environment:
      TOKEN: ${BROWSERLESS_TOKEN:?Set BROWSERLESS_TOKEN in .env}
      CONCURRENT: "2"
      QUEUED: "4"
      TIMEOUT: "1800000"
      MAX_RECONNECT_TIME: "300000"
      HEALTH: "true"
      MAX_MEMORY_PERCENT: "90"
      MAX_CPU_PERCENT: "90"
    expose:
      - "3000"
    shm_size: "1gb"
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=768m,mode=1777
      - /home/blessuser:rw,nosuid,nodev,size=64m,uid=999,gid=999,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: 3g
    cpus: 2
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://127.0.0.1:3000/active?token=$$TOKEN' >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped


  jcyber:
    image: ghcr.io/i098/jcyber:${JCYBER_TAG:-latest}
    depends_on:
      postgres:
        condition: service_healthy
      browser:
        condition: service_healthy
    environment:
      JCYBER_PG_DSN: postgres://${POSTGRES_USER:-jcyber}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-jcyber}?sslmode=disable
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      JCYBER_LLM_PROVIDER: ${JCYBER_LLM_PROVIDER:-}
      JCYBER_LLM_MODEL: ${JCYBER_LLM_MODEL:-}
      JCYBER_LLM_BASE_URL: ${JCYBER_LLM_BASE_URL:-}
      JCYBER_LLM_PROXY: ${JCYBER_LLM_PROXY:-}
      JCYBER_BROWSER_CDP_ENDPOINT: "ws://browser:3000/chromium?token=${BROWSERLESS_TOKEN}&headless=false&timeout=1800000"
      PLAYWRIGHT_MCP_CDP_ENDPOINT: "ws://browser:3000/chromium?token=${BROWSERLESS_TOKEN}&headless=false&timeout=1800000"
    ports:
      - "8787:8787"
      - "127.0.0.1:8788:8788"
    volumes:
      # 把数据目录（含 jwt.key、SQLite 等）绑定到项目根目录的 data/，
      # 方便在宿主机直接查看/备份，容器重建也不丢。
      - ./data:/app/data
      # 把项目根目录的 skills 挂进容器（覆盖镜像内置的 /app/skills）；
      # 改 skill 无需重建镜像，容器读的就是宿主机这份。
      - ./skills:/app/skills
    shm_size: "1gb"
    restart: unless-stopped

volumes:
  pgdata:
