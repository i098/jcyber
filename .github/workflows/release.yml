name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Export the frontend once for all release targets.
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
        working-directory: web
      - run: bun run build:static
        working-directory: web
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/out
          if-no-files-found: error

  # Keep the archive format used by build.sh and the in-app updater.
  binaries:
    needs: frontend
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: server/webui/dist
      - name: Build and package with build.sh
        env:
          JCYBER_TARGET_OS: ${{ matrix.goos }}
          JCYBER_TARGET_ARCH: ${{ matrix.goarch }}
          JCYBER_BUILD_VERSION: ${{ github.ref_name }}
          JCYBER_SKIP_FRONTEND: "1"
          # UPX 自解压 ELF 在部分 Linux 内核、虚拟化和安全策略下会崩溃。
          # Release 使用 Go linker 裁剪和 zip 压缩，优先保证可移植性。
          JCYBER_COMPRESS: "0"
          JCYBER_PACKAGE: "1"
          JCYBER_PACKAGE_DIR: dist
        run: |
          ./build.sh --target "${JCYBER_TARGET_OS}/${JCYBER_TARGET_ARCH}"
      - name: Smoke test Linux amd64 binary
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: dist/apagent-linux-amd64/apagent -h
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.goos }}-${{ matrix.goarch }}
          path: "dist/*.zip"
          if-no-files-found: error
      - name: Prepare container binary
        if: matrix.goos == 'linux'
        run: install -Dm755 dist/apagent-linux-${{ matrix.goarch }}/apagent dist/${{ matrix.goarch }}/jcyber
      - if: matrix.goos == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: bin-linux-${{ matrix.goarch }}
          path: dist/${{ matrix.goarch }}/jcyber
          if-no-files-found: error

  # Publish all five archives with their checksums.
  release:
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          merge-multiple: true
          path: dist
      - name: Generate checksums
        working-directory: dist
        run: sha256sum *.zip > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true

  docker:
    needs: binaries
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker.yml
